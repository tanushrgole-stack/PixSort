<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="gsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="30%" stop-color="#FFB703"/>
      <stop offset="65%" stop-color="#FFD580"/>
      <stop offset="100%" stop-color="#FFF1CC"/>
    </linearGradient>
    <linearGradient id="ghill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D5A30"/>
      <stop offset="100%" stop-color="#1A3D1E"/>
    </linearGradient>
    <radialGradient id="gsun" cx="80%" cy="40%" r="18%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#FFB703" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Sunset sky -->
  <rect width="400" height="300" fill="url(#gsky)"/>
  <circle cx="320" cy="120" r="55" fill="url(#gsun)"/>
  <circle cx="320" cy="120" r="32" fill="#FFE066"/>
  <circle cx="320" cy="120" r="22" fill="#FFD580"/>

  <!-- Silhouette hills -->
  <ellipse cx="0" cy="260" rx="140" ry="80" fill="url(#ghill)"/>
  <ellipse cx="400" cy="260" rx="140" ry="80" fill="url(#ghill)"/>
  <rect x="0" y="250" width="400" height="50" fill="#1A3D1E"/>

  <!-- Clouds (warm tinted) -->
  <ellipse cx="80" cy="80" rx="45" ry="18" fill="#FFE8DC" opacity="0.6"/>
  <ellipse cx="110" cy="70" rx="35" ry="15" fill="#FFD9CC" opacity="0.55"/>
  <ellipse cx="55" cy="85" rx="28" ry="13" fill="#FFE8DC" opacity="0.5"/>
  <ellipse cx="200" cy="60" rx="40" ry="15" fill="#FFE8DC" opacity="0.4"/>

  <!-- Group of friends silhouettes (close, tight group) -->
  <!-- They are taking a selfie, all squished together -->

  <!-- Background person 1 (left back) -->
  <ellipse cx="145" cy="175" rx="11" ry="11" fill="#2B1A10" opacity="0.75"/>
  <path d="M136,185 Q145,182 154,185 L154,215 Q145,218 136,215 Z" fill="#1A0A18" opacity="0.75"/>

  <!-- Background person 2 (right back) -->
  <ellipse cx="258" cy="172" rx="11" ry="11" fill="#3D2015" opacity="0.75"/>
  <path d="M249,182 Q258,179 267,182 L267,215 Q258,218 249,215 Z" fill="#1A0A28" opacity="0.75"/>

  <!-- Main group (foreground, more colorful) -->
  <!-- Person A (far left) -->
  <ellipse cx="118" cy="185" rx="13" ry="13" fill="#C4845A"/>
  <path d="M106,197 Q118,193 130,197 L132,225 Q118,229 106,225 Z" fill="#FF6B4A"/>
  <!-- hair -->
  <path d="M105,180 Q118,168 131,180" fill="#2B1A10" opacity="0.9"/>
  <!-- raised arm for selfie -->
  <path d="M130,200 Q148,185 155,175" stroke="#C4845A" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Person B -->
  <ellipse cx="162" cy="181" rx="13" ry="13" fill="#8B5E3C"/>
  <path d="M150,192 Q162,188 174,192 L176,222 Q162,226 150,222 Z" fill="#FFB703"/>
  <!-- sunglasses -->
  <rect x="153" y="177" width="8" height="5" rx="2" fill="#1A1A2E"/>
  <rect x="163" y="177" width="8" height="5" rx="2" fill="#1A1A2E"/>
  <line x1="161" y1="179" x2="163" y2="179" stroke="#888" stroke-width="1"/>
  <!-- phone arm -->
  <path d="M174,197 Q190,182 198,172" stroke="#8B5E3C" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Phone (selfie stick) -->
  <rect x="192" y="162" width="22" height="16" rx="3" fill="#2B2118"/>
  <rect x="194" y="164" width="18" height="12" rx="2" fill="#87CEEB" opacity="0.85"/>
  <!-- Camera flash -->
  <circle cx="209" cy="166" r="3" fill="#FFE066"/>

  <!-- Person C (center, tallest) -->
  <ellipse cx="208" cy="178" rx="14" ry="14" fill="#3D2015"/>
  <path d="M195,191 Q208,187 221,191 L223,224 Q208,228 194,224 Z" fill="#A855F7"/>
  <!-- big smile indicator -->
  <circle cx="204" cy="182" r="2" fill="#C4845A"/>
  <circle cx="212" cy="182" r="2" fill="#C4845A"/>

  <!-- Person D -->
  <ellipse cx="250" cy="181" rx="13" ry="13" fill="#C4A480"/>
  <path d="M238,192 Q250,188 262,192 L264,222 Q250,226 238,222 Z" fill="#2196C4"/>
  <!-- hair bun -->
  <circle cx="250" cy="169" r="8" fill="#2B1A10"/>
  <!-- arms around friends -->
  <path d="M238,197 Q225,190 220,185" stroke="#C4845A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M262,197 Q275,190 280,185" stroke="#C4845A" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Person E (far right) -->
  <ellipse cx="287" cy="185" rx="13" ry="13" fill="#8B4A2A"/>
  <path d="M275,196 Q287,192 299,196 L301,225 Q287,229 275,225 Z" fill="#EC4899"/>
  <!-- hat -->
  <ellipse cx="287" cy="175" rx="17" ry="6" fill="#2B2118"/>
  <rect x="278" y="161" width="18" height="15" rx="2" fill="#2B2118"/>

  <!-- Celebration - hands up -->
  <path d="M106,200 Q90,185 85,175" stroke="#C4845A" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M299,200 Q314,185 320,175" stroke="#C4845A" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- V signs / peace fingers -->
  <path d="M85,173 L82,163 M85,173 L88,162" stroke="#C4845A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M320,173 L317,163 M320,173 L323,162" stroke="#C4845A" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Sun rays -->
  <line x1="320" y1="88" x2="320" y2="70" stroke="#FFE066" stroke-width="2" opacity="0.6"/>
  <line x1="338" y1="102" x2="350" y2="92" stroke="#FFE066" stroke-width="2" opacity="0.5"/>
  <line x1="344" y1="122" x2="360" y2="120" stroke="#FFE066" stroke-width="2" opacity="0.5"/>
  <line x1="302" y1="102" x2="290" y2="92" stroke="#FFE066" stroke-width="2" opacity="0.5"/>
  <line x1="296" y1="122" x2="280" y2="120" stroke="#FFE066" stroke-width="2" opacity="0.5"/>

  <!-- Heart emojis floating -->
  <text x="68" y="145" font-size="16" fill="#FF6B4A" opacity="0.7">♥</text>
  <text x="348" y="130" font-size="12" fill="#FFB703" opacity="0.7">♥</text>
  <text x="175" y="140" font-size="10" fill="#FF6B4A" opacity="0.6">♥</text>
</svg>
