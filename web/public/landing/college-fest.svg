<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="csky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A1A"/>
      <stop offset="60%" stop-color="#1A0A28"/>
      <stop offset="100%" stop-color="#2D1545"/>
    </linearGradient>
    <linearGradient id="cstage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D1545"/>
      <stop offset="100%" stop-color="#1A0A28"/>
    </linearGradient>
    <radialGradient id="spotlight1" cx="30%" cy="0%" r="40%">
      <stop offset="0%" stop-color="#FFB703" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="spotlight2" cx="70%" cy="0%" r="40%">
      <stop offset="0%" stop-color="#FF6B4A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="spotlight3" cx="50%" cy="0%" r="30%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Night sky -->
  <rect width="400" height="300" fill="url(#csky)"/>

  <!-- Spotlights -->
  <rect width="400" height="300" fill="url(#spotlight1)"/>
  <rect width="400" height="300" fill="url(#spotlight2)"/>
  <rect width="400" height="300" fill="url(#spotlight3)"/>

  <!-- Stars -->
  <circle cx="30" cy="20" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="80" cy="15" r="1" fill="white" opacity="0.5"/>
  <circle cx="150" cy="10" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="250" cy="12" r="1" fill="white" opacity="0.5"/>
  <circle cx="320" cy="18" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="370" cy="8" r="1" fill="white" opacity="0.4"/>

  <!-- Stage platform -->
  <rect x="60" y="145" width="280" height="20" rx="4" fill="url(#cstage)"/>
  <rect x="60" y="145" width="280" height="6" rx="2" fill="#A855F7" opacity="0.5"/>
  <!-- Stage edge lights -->
  <circle cx="75" cy="148" r="4" fill="#FFB703" opacity="0.9"/>
  <circle cx="105" cy="148" r="4" fill="#FF6B4A" opacity="0.9"/>
  <circle cx="135" cy="148" r="4" fill="#A855F7" opacity="0.9"/>
  <circle cx="165" cy="148" r="4" fill="#FFB703" opacity="0.9"/>
  <circle cx="195" cy="148" r="4" fill="#FF6B4A" opacity="0.9"/>
  <circle cx="225" cy="148" r="4" fill="#A855F7" opacity="0.9"/>
  <circle cx="255" cy="148" r="4" fill="#FFB703" opacity="0.9"/>
  <circle cx="285" cy="148" r="4" fill="#FF6B4A" opacity="0.9"/>
  <circle cx="315" cy="148" r="4" fill="#A855F7" opacity="0.9"/>

  <!-- Stage performers (silhouettes) -->
  <!-- Guitarist left -->
  <ellipse cx="145" cy="118" rx="12" ry="12" fill="#C4845A"/>
  <path d="M134,129 Q145,125 156,129 L158,148 Q145,152 132,148 Z" fill="#1A0A28"/>
  <!-- guitar shape -->
  <path d="M155,135 Q168,130 170,138 Q172,146 160,145 Q148,145 148,137 Q149,130 155,135Z" fill="#8B6914"/>
  <line x1="155" y1="128" x2="170" y2="128" stroke="#8B6914" stroke-width="2"/>
  <!-- Mic stand -->
  <line x1="200" y1="90" x2="200" y2="148" stroke="#888" stroke-width="2"/>
  <ellipse cx="200" cy="90" rx="8" ry="6" fill="#555"/>
  <!-- Singer -->
  <ellipse cx="200" cy="110" rx="13" ry="13" fill="#3D2015"/>
  <path d="M188,122 Q200,118 212,122 L214,148 Q200,152 186,148 Z" fill="#FF6B4A"/>
  <!-- raised arm with mic -->
  <path d="M212,130 Q228,118 230,112" stroke="#C4845A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <ellipse cx="232" cy="110" rx="5" ry="7" fill="#555"/>
  <!-- DJ on right -->
  <ellipse cx="260" cy="118" rx="12" ry="12" fill="#8B5E3C"/>
  <path d="M249,129 Q260,125 271,129 L272,148 Q260,152 248,148 Z" fill="#A855F7"/>
  <!-- Headphones -->
  <path d="M249,113 Q260,105 271,113" stroke="#2B2118" stroke-width="4" fill="none"/>
  <circle cx="249" cy="114" r="5" fill="#2B2118"/>
  <circle cx="271" cy="114" r="5" fill="#2B2118"/>

  <!-- Crowd silhouettes (front) -->
  <!-- Row 1 close -->
  <ellipse cx="90" cy="195" rx="14" ry="14" fill="#2B1A10" opacity="0.9"/>
  <rect x="78" y="208" width="24" height="35" rx="4" fill="#1A0A18" opacity="0.9"/>
  <ellipse cx="130" cy="188" rx="13" ry="13" fill="#3D2015" opacity="0.85"/>
  <rect x="118" y="200" width="22" height="40" rx="4" fill="#1A0A28" opacity="0.85"/>
  <ellipse cx="168" cy="192" rx="13" ry="13" fill="#2B1A10" opacity="0.9"/>
  <rect x="156" y="204" width="22" height="38" rx="4" fill="#1A0A18" opacity="0.9"/>
  <ellipse cx="230" cy="188" rx="13" ry="13" fill="#3D2015" opacity="0.85"/>
  <rect x="218" y="200" width="22" height="40" rx="4" fill="#1A0A28" opacity="0.85"/>
  <ellipse cx="270" cy="193" rx="14" ry="14" fill="#2B1A10" opacity="0.9"/>
  <rect x="258" y="206" width="24" height="36" rx="4" fill="#1A0A18" opacity="0.9"/>
  <ellipse cx="310" cy="188" rx="13" ry="13" fill="#3D2015" opacity="0.85"/>
  <rect x="298" y="200" width="22" height="40" rx="4" fill="#1A0A28" opacity="0.85"/>

  <!-- Arms raised in crowd -->
  <path d="M78,215 Q62,200 55,190" stroke="#2B1A10" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M118,207 Q105,194 100,183" stroke="#2B1A10" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M218,207 Q205,192 200,181" stroke="#2B1A10" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M320,207 Q334,192 340,181" stroke="#2B1A10" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- Row 2 far back (smaller) -->
  <ellipse cx="55" cy="230" rx="11" ry="11" fill="#1A0A18" opacity="0.7"/>
  <rect x="45" y="240" width="20" height="30" rx="3" fill="#0A0A18" opacity="0.7"/>
  <ellipse cx="200" cy="225" rx="11" ry="11" fill="#1A0A18" opacity="0.7"/>
  <rect x="190" y="235" width="20" height="35" rx="3" fill="#0A0A18" opacity="0.7"/>
  <ellipse cx="350" cy="230" rx="11" ry="11" fill="#1A0A18" opacity="0.7"/>
  <rect x="340" y="240" width="20" height="30" rx="3" fill="#0A0A18" opacity="0.7"/>

  <!-- Phone screens in crowd (lit) -->
  <rect x="82" y="210" width="10" height="15" rx="2" fill="#87CEEB" opacity="0.6"/>
  <rect x="225" y="205" width="10" height="15" rx="2" fill="#87CEEB" opacity="0.5"/>
  <rect x="275" y="208" width="10" height="15" rx="2" fill="#87CEEB" opacity="0.6"/>

  <!-- Confetti burst -->
  <rect x="40" y="60" width="8" height="5" rx="1" fill="#FFB703" opacity="0.8" transform="rotate(40,40,60)"/>
  <rect x="100" y="40" width="7" height="4" rx="1" fill="#FF6B4A" opacity="0.8" transform="rotate(-25,100,40)"/>
  <rect x="300" y="50" width="8" height="5" rx="1" fill="#A855F7" opacity="0.8" transform="rotate(60,300,50)"/>
  <rect x="360" y="70" width="7" height="4" rx="1" fill="#FFB703" opacity="0.7" transform="rotate(-40,360,70)"/>
  <circle cx="80" cy="55" r="4" fill="#FF6B4A" opacity="0.7"/>
  <circle cx="330" cy="45" r="4" fill="#FFB703" opacity="0.7"/>
  <circle cx="200" cy="30" r="3" fill="#A855F7" opacity="0.8"/>

  <!-- Laser beams -->
  <line x1="200" y1="145" x2="20" y2="10" stroke="#FF6B4A" stroke-width="1.5" opacity="0.3"/>
  <line x1="200" y1="145" x2="380" y2="20" stroke="#A855F7" stroke-width="1.5" opacity="0.3"/>
  <line x1="145" y1="145" x2="350" y2="5" stroke="#FFB703" stroke-width="1.5" opacity="0.25"/>
</svg>
