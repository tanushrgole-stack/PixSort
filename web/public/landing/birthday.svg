<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="proom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A0A28"/>
      <stop offset="100%" stop-color="#2D1545"/>
    </linearGradient>
    <radialGradient id="plight" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#FFB703" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="pcake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8F5"/>
      <stop offset="100%" stop-color="#FFD9CC"/>
    </linearGradient>
    <linearGradient id="ptable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="100%" stop-color="#5D4A14"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#proom)"/>
  <rect width="400" height="300" fill="url(#plight)"/>

  <!-- Streamer strings from top -->
  <path d="M50,0 Q70,40 55,80 Q40,120 60,160" stroke="#FF6B4A" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M120,0 Q140,50 125,90 Q110,130 130,170" stroke="#FFB703" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M200,0 Q220,45 205,85 Q190,125 210,165" stroke="#A855F7" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M280,0 Q260,50 275,90 Q290,130 270,165" stroke="#FF6B4A" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M350,0 Q330,40 345,80 Q360,120 340,160" stroke="#FFB703" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Balloons cluster left -->
  <circle cx="45" cy="80" r="28" fill="#FF6B4A" opacity="0.85"/>
  <circle cx="75" cy="65" r="24" fill="#FFB703" opacity="0.85"/>
  <circle cx="30" cy="55" r="20" fill="#A855F7" opacity="0.75"/>
  <line x1="45" y1="108" x2="50" y2="160" stroke="#888" stroke-width="1.5"/>
  <line x1="75" y1="89" x2="72" y2="160" stroke="#888" stroke-width="1.5"/>
  <line x1="30" y1="75" x2="35" y2="160" stroke="#888" stroke-width="1.5"/>

  <!-- Balloons cluster right -->
  <circle cx="355" cy="80" r="28" fill="#FFB703" opacity="0.85"/>
  <circle cx="325" cy="65" r="24" fill="#FF6B4A" opacity="0.85"/>
  <circle cx="370" cy="55" r="20" fill="#EC4899" opacity="0.75"/>
  <line x1="355" y1="108" x2="350" y2="160" stroke="#888" stroke-width="1.5"/>
  <line x1="325" y1="89" x2="328" y2="160" stroke="#888" stroke-width="1.5"/>
  <line x1="370" y1="75" x2="365" y2="160" stroke="#888" stroke-width="1.5"/>

  <!-- Party banner -->
  <path d="M80,30 L200,15 L320,30" stroke="#FFB703" stroke-width="2" fill="none"/>
  <!-- Banner triangles -->
  <polygon points="80,30 95,30 87,50" fill="#FF6B4A"/>
  <polygon points="100,27 115,27 107,47" fill="#FFB703"/>
  <polygon points="120,24 135,24 127,44" fill="#A855F7"/>
  <polygon points="140,22 155,22 147,42" fill="#FF6B4A"/>
  <polygon points="160,20 175,20 167,40" fill="#EC4899"/>
  <polygon points="180,18 195,18 187,38" fill="#FFB703"/>
  <polygon points="200,18 215,18 207,38" fill="#FF6B4A"/>
  <polygon points="220,19 235,19 227,39" fill="#A855F7"/>
  <polygon points="240,21 255,21 247,41" fill="#FFB703"/>
  <polygon points="260,23 275,23 267,43" fill="#FF6B4A"/>
  <polygon points="280,25 295,25 287,45" fill="#EC4899"/>
  <polygon points="300,27 315,27 307,47" fill="#FFB703"/>

  <!-- Confetti scatter -->
  <rect x="100" y="40" width="8" height="5" rx="1" fill="#FF6B4A" opacity="0.8" transform="rotate(30,100,40)"/>
  <rect x="160" y="60" width="7" height="4" rx="1" fill="#FFB703" opacity="0.8" transform="rotate(-20,160,60)"/>
  <rect x="250" y="45" width="8" height="5" rx="1" fill="#A855F7" opacity="0.8" transform="rotate(45,250,45)"/>
  <rect x="300" y="70" width="6" height="4" rx="1" fill="#FF6B4A" opacity="0.7" transform="rotate(-35,300,70)"/>
  <circle cx="135" cy="80" r="4" fill="#FFB703" opacity="0.7"/>
  <circle cx="265" cy="75" r="4" fill="#FF6B4A" opacity="0.7"/>
  <circle cx="185" cy="50" r="3" fill="#EC4899" opacity="0.8"/>

  <!-- Table -->
  <rect x="100" y="195" width="200" height="12" rx="4" fill="url(#ptable)"/>
  <rect x="115" y="207" width="10" height="50" rx="2" fill="#5D4A14"/>
  <rect x="275" y="207" width="10" height="50" rx="2" fill="#5D4A14"/>

  <!-- Cake on table -->
  <!-- Base tier -->
  <rect x="160" y="160" width="80" height="38" rx="6" fill="url(#pcake)"/>
  <rect x="160" y="160" width="80" height="8" rx="4" fill="#FFD9CC"/>
  <!-- Middle tier -->
  <rect x="172" y="130" width="56" height="32" rx="5" fill="#FFF8F5"/>
  <rect x="172" y="130" width="56" height="7" rx="3" fill="#FFD9CC"/>
  <!-- Top tier -->
  <rect x="184" y="107" width="32" height="25" rx="4" fill="url(#pcake)"/>
  <!-- Candles -->
  <rect x="192" y="92" width="5" height="17" rx="2" fill="#FFB703"/>
  <rect x="203" y="90" width="5" height="19" rx="2" fill="#FF6B4A"/>
  <rect x="214" y="93" width="5" height="16" rx="2" fill="#A855F7"/>
  <!-- Flames -->
  <ellipse cx="194" cy="90" rx="4" ry="6" fill="#FFE066"/>
  <ellipse cx="194" cy="90" rx="2" ry="4" fill="#FF6B4A"/>
  <ellipse cx="205" cy="88" rx="4" ry="6" fill="#FFE066"/>
  <ellipse cx="205" cy="88" rx="2" ry="4" fill="#FF6B4A"/>
  <ellipse cx="216" cy="91" rx="4" ry="6" fill="#FFE066"/>
  <ellipse cx="216" cy="91" rx="2" ry="4" fill="#FF6B4A"/>
  <!-- Cake decorations -->
  <circle cx="175" cy="175" r="4" fill="#FF6B4A"/>
  <circle cx="190" cy="172" r="4" fill="#FFB703"/>
  <circle cx="205" cy="175" r="4" fill="#A855F7"/>
  <circle cx="220" cy="172" r="4" fill="#FF6B4A"/>
  <circle cx="235" cy="175" r="4" fill="#FFB703"/>
  <text x="145" y="192" font-size="11" fill="#FF6B4A" font-family="Georgia,serif">🎂</text>

  <!-- People at party -->
  <!-- Person 1 (left of table) -->
  <ellipse cx="118" cy="172" rx="12" ry="12" fill="#C4845A"/>
  <path d="M107,183 Q118,179 129,183 L131,210 Q118,215 105,210 Z" fill="#FF6B4A"/>
  <!-- Party hat -->
  <polygon points="106,160 118,138 130,160" fill="#FFB703"/>
  <circle cx="118" cy="138" r="4" fill="#FF6B4A"/>

  <!-- Person 2 (right of table) -->
  <ellipse cx="282" cy="172" rx="12" ry="12" fill="#8B5E3C"/>
  <path d="M271,183 Q282,179 293,183 L295,210 Q282,215 269,210 Z" fill="#A855F7"/>
  <!-- Party hat -->
  <polygon points="270,160 282,138 294,160" fill="#FF6B4A"/>
  <circle cx="282" cy="138" r="4" fill="#FFB703"/>

  <!-- Person 3 (far right) -->
  <ellipse cx="340" cy="178" rx="11" ry="11" fill="#2B1A10"/>
  <path d="M330,188 Q340,185 350,188 L352,215 Q340,219 328,215 Z" fill="#FFB703"/>
  <!-- arms raised in celebration -->
  <path d="M330,195 Q315,182 310,172" stroke="#C4845A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M350,195 Q365,182 370,172" stroke="#C4845A" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Person 4 (far left) -->
  <ellipse cx="60" cy="178" rx="11" ry="11" fill="#3D2015"/>
  <path d="M50,188 Q60,185 70,188 L72,215 Q60,219 48,215 Z" fill="#EC4899"/>
  <!-- arms raised -->
  <path d="M50,195 Q35,182 30,172" stroke="#C4845A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M70,195 Q85,182 90,172" stroke="#C4845A" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Star burst top center -->
  <text x="188" y="12" font-size="22" fill="#FFB703" opacity="0.9">🎉</text>
  <text x="90" y="22" font-size="16" fill="#FF6B4A" opacity="0.8">✨</text>
  <text x="295" y="20" font-size="16" fill="#FFB703" opacity="0.8">✨</text>
</svg>
